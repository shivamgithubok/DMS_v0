# Render Blueprint. In the dashboard: New → Blueprint → this repo,
# Root Directory = cloud
databases:
  - name: vms-db
    plan: free
    databaseName: vms
    user: vms

services:
  - type: web
    name: vms-api
    runtime: docker
    # The free plan sleeps. A production account uses a plan that stays awake.
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vms-db
          property: connectionString
      - key: MQTT_HOST
        sync: false
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TLS
        value: "true"
      - key: DEFAULT_RIDE_ID
        value: ride-1842
      - key: DEFAULT_DEVICE_ID
        value: orin-nano-01
      - key: GUARDIAN_AUTH_REQUIRED
        value: "1"
      - key: GUARDIAN_REQUIRE_DEVICE_KEY
        value: "1"
      - key: SEED_DEMO
        value: "0"
      - key: GUARDIAN_API_KEY
        sync: false
      - key: GUARDIAN_SESSION_SECRET
        sync: false
      - key: MEDIA_DEVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
