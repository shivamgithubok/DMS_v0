# Render Blueprint. In the dashboard: New → Blueprint → this repo,
# Root Directory = cloud
databases:
  - name: vms-db
    plan: free
    databaseName: vms
    user: vms

services:
  - type: web
    name: vms-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vms-db
          property: connectionString
      - key: MQTT_HOST
        sync: false
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TLS
        value: "false"
      - key: DEFAULT_RIDE_ID
        value: ride-1842
      - key: DEFAULT_DEVICE_ID
        value: orin-nano-01
